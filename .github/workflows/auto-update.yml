name: 每日自动更新生活小妙招

on:
  schedule:
    # 每天北京时间 11:15 运行（UTC 03:15）
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取并生成页面
        run: node scripts/update.mjs

      - name: 有变化就提交推送
        run: |
          git config user.name "auto-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/tips.json
          if git diff --cached --quiet; then
            echo "今天没有变化，跳过提交"
          else
            git commit -m "自动更新生活小妙招 $(date -u +%F)"
            git push
          fi
