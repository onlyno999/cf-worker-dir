<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生活小妙招</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #eef2f7 0%, #dbe4ee 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 36px 30px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .tag {
      display: inline-block;
      padding: 5px 14px;
      background: #e8f4ff;
      color: #0070f3;
      font-size: 13px;
      font-weight: 600;
      border-radius: 20px;
      margin-bottom: 22px;
    }
    .tip-title {
      font-size: 20px;
      font-weight: 700;
      color: #222;
      margin-bottom: 16px;
    }
    .tip-content {
      font-size: 16px;
      color: #555;
      line-height: 1.8;
      margin-bottom: 30px;
      min-height: 70px;
      text-align: justify;
    }
    .refresh-btn {
      background: #0070f3;
      color: #ffffff;
      border: none;
      padding: 12px 30px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 112, 243, 0.25);
      transition: all 0.2s ease;
    }
    .refresh-btn:hover {
      background: #005bb5;
    }
    .refresh-btn:disabled {
      background: #a0c7ff;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="tag" id="tag">生活贴士</span>
    <h2 class="tip-title" id="title">今日妙招</h2>
    <p class="tip-content" id="content">正在获取最新妙招...</p>
    <button class="refresh-btn" id="btn" onclick="fetchTip()">换一个妙招</button>
    <div class="status" id="status">点击按钮或按 F5 刷新</div>
  </div>

  <script>
    // 离线备用数据（防网络卡顿）
    const backupTips = [
      "切洋葱前将洋葱放进冷水里浸泡5分钟或冰箱冷冻10分钟，切的时候就不会刺激眼睛流泪。",
      "衣服刚沾上油污千万不要先沾水，取少许洗洁精直接涂抹干搓1分钟，再冲水清洗即可恢复如新。",
      "撕掉餐具或物品上的顽固胶标，涂上一层风油精或食用油静置2分钟，胶质软化后一擦即净。",
      "微波炉有异味油污，放半碗水加入两勺白醋或柠檬片高火转3分钟，蒸汽熏软油污后擦拭干净如新。",
      "水龙头表面水垢，用厨房纸巾浸透白醋包敷15分钟，取下后用清水一冲立刻光亮照人。"
    ];

    async function fetchTip() {
      const btn = document.getElementById('btn');
      const contentEl = document.getElementById('content');
      const statusEl = document.getElementById('status');

      btn.disabled = true;
      contentEl.innerText = "正在加载中...";

      try {
        // 免 Key 免费国内接口（加时间戳防缓存）
        const res = await fetch(`https://api.vvhan.com/api/ian/special?type=json&t=${Date.now()}`);
        if (!res.ok) throw new Error("网络错误");
        
        const data = await res.json();
        
        // 读取接口返回内容
        if (data.success && data.data) {
          contentEl.innerText = data.data.content || data.data;
          statusEl.innerText = "数据已更新（在线接口）";
        } else {
          throw new Error("数据格式异常");
        }
      } catch (e) {
        // 请求受阻时自动切回本地随机妙招
        const randomItem = backupTips[Math.floor(Math.random() * backupTips.length)];
        contentEl.innerText = randomItem;
        statusEl.innerText = "网络波动，已展示内置实用妙招";
      } finally {
        btn.disabled = false;
      }
    }

    // 页面初次进入或刷新时自动拉取
    window.onload = fetchTip;
  </script>

</body>
</html>
